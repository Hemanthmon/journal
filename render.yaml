# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# In the Render dashboard: New → Blueprint → pick this repository. Render will ask for the
# values marked `sync: false` (database connection); never commit them.
services:
  - type: web
    name: journal-api
    runtime: node
    plan: free
    # Install only the API, shared and web dashboard packages (not the Expo app). Dev
    # dependencies are needed to compile TypeScript, so include them even though
    # NODE_ENV=production. The API serves the built dashboard from apps/web/dist.
    buildCommand: npm ci --include=dev --workspace=@journal/shared --workspace=@journal/api --workspace=@journal/web && npm run build -w @journal/api && npm run build -w @journal/web
    # Apply pending database migrations, then start. (Pre-deploy commands aren't available
    # on the free plan; the migration runner is idempotent and takes a lock.)
    startCommand: node apps/api/dist/db/migrate-cli.js && node apps/api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    # Only redeploy when backend code changes, not on mobile-app commits.
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render terminates TLS; trust its X-Forwarded-Proto so HTTPS enforcement works.
      - key: TRUST_PROXY
        value: "1"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: journal
      - key: DB_SSL
        value: "1"
      # Aiven's CA certificate (public, committed at apps/api/certs/ca.pem).
      - key: DB_SSL_CA_PATH
        value: certs/ca.pem
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: CORS_ORIGINS
        value: ""
      # Read-only web dashboard. Leave the emails empty to keep it disabled; clearing
      # DASHBOARD_VIEWER_EMAIL and redeploying revokes access immediately.
      - key: DASHBOARD_VIEWER_EMAIL
        sync: false
      - key: DASHBOARD_OWNER_EMAIL
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: MAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      # Google Calendar two-way sync (optional): OAuth client from Google Cloud. Leave the
      # client id empty to keep it off. The token key is generated once by Render.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_TOKEN_KEY
        generateValue: true
      - key: PUBLIC_URL
        value: https://journal-api-sv60.onrender.com
