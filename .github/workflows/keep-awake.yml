# Render's free plan puts the API to sleep after ~15 minutes without traffic, and the first
# request after that waits up to a minute. Opening the health check every 10 minutes keeps
# it awake (one free instance can stay up 24/7 within Render's monthly free hours).
name: Keep the API awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --silent --show-error --fail --retry 3 --retry-delay 10 --max-time 90 https://journal-api-sv60.onrender.com/api/health
